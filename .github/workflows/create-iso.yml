##############################################################################
name: 💿 Build ISO VoidBR
permissions:
  contents: write
#concurrency:
#  group: build-iso-${{ github.workflow }}
#  cancel-in-progress: false

# Gatilhos para o workflow
on:
  #push:
  #  branches:
  #    - main
  repository_dispatch: # aguarda um evento externo para iniciar o workflow (útil para automações externas que acionam o GitHub Actions).
    types:
      - "ISO-*"
  workflow_dispatch:
    inputs:
      edition:
        type: choice
        description: "Edition"
        options:
          - teste
          - all
          - base
          #- awesome
          - cinnamon
          #- enlightenment
          #- fluxbox
          - fullx
          - gnome
          - plasma
          - mate
          - xfce
        default: "teste"
      vol_id:
        type: string
        description: "Nome do VOLUME da ISO"
        required: true
        default: "VOIDBR_LIVE"
      teste_input:
        type: boolean
        description: "Enable only test"
        required: false
        default: false
      tmate:
        type: boolean
        description: "Enable debugging with tmate"
        required: false
        default: false

  schedule:
    #- cron: "0 6 * * *" # Roda todo dia às 06:00 UTC
    - cron: "0 18 * * 5" # Roda toda sexta-feira às 18:00 UTC

env:
  TS_AUTHKEY: "${{ secrets.TS_AUTHKEY }}"
  TS_VOIDREPO_IP: "${{ secrets.TS_VOIDREPO_IP }}"
  TS_VOIDREPO_PORT: "${{ secrets.TS_VOIDREPO_PORT }}"
  TELEGRAM_TOKEN: "${{ secrets.TOKEN_BOT }}"
  TELEGRAM_VOIDBR_ISO_TOKEN_BOT: "${{ secrets.VOIDBR_ISO_TOKEN_BOT }}"
  #GITHUB_TOKEN: "${{ secrets.TOKEN_RELEASE }}"
  #GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
  GITHUB_TOKEN: "${{ secrets.ORGANIZATION_TOKEN }}"
  CHAT_ID: "${{ secrets.CHAT_ID }}"
  MESSAGE_THREAD_ID: "${{ secrets.MESSAGE_THREAD_ID }}"
  started_by_user: "${{ github.actor }}"
  triggered_by_user: "${{ github.triggering_actor }}"
  repo_path: "${{ secrets.PKGBUILD_DIR }}"
  iso_distroname: "${{ github.event.client_payload.distroname || inputs.distroname || 'voidbr' }}"
  iso_profile: "${{ github.event.client_payload.iso_profiles_repo || inputs.iso_profiles_repo || 'profile' }}"
  #iso_manjaro_branch: "${{ github.event.client_payload.manjaro_branch || inputs.manjaro_branch}}"
  #iso_biglinux_branch: "${{ github.event.client_payload.biglinux_branch || inputs.biglinux_branch}}"
  #iso_bigcommunity_branch: "${{ github.event.client_payload.community_branch || inputs.community_branch}}"
  #iso_chililinux_branch: "${{ github.event.client_payload.chililinux_branch || inputs.chililinux_branch}}"
  #iso_kernel: "${{ github.event.client_payload.kernel || inputs.kernel }}"
  iso_edition: "${{ github.event.client_payload.edition || inputs.edition || 'teste' }}"
  vol_id: "${{ github.event.client_payload.vol_id || inputs.vol_id }}"
  DEBUG: "${{ github.event.client_payload.tmate || inputs.tmate || false }}"
  tmate: "${{ github.event.client_payload.tmate || inputs.tmate || false }}"
  OUTPUT_FILE: "<keep calm>"
  wf_url: "https://github.com/${{ github.repository }}/blob/main/.github/workflows/create-iso.yml"
  wf_file: "create-iso.yml"
  voidrepo_void_mirror_iso: "/voidrepo/void-mirror/iso"

jobs:
  setup:
    runs-on: ubuntu-latest
    #runs-on: self-hosted
    outputs:
      time: ${{ steps.time.outputs.time }} # Saída do job
      REPOSITORY_NAME: ${{ steps.get-repo-name.outputs.repo_name }}
      RELEASE_TAG: ${{ steps.set_vars.outputs.RELEASE_TAG }}
      ISO_BASENAME: ${{ steps.set_vars.outputs.ISO_BASENAME }}
      KERNEL_VERSION: ${{ steps.set_vars.outputs.KERNEL_VERSION }}
    steps:
      - name: Set VARS manually
        id: set_vars
        shell: bash
        run: |
          # Set release tag manually
          RELEASE_TAG="${release_tag:-$(date '+%Y%m%d-%H%M')}"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "KERNEL_VERSION=6.12.74_1" >> "$GITHUB_OUTPUT"
          echo "KERNEL_VERSION=6.12.74_1" >> "$GITHUB_ENV"
          echo "ISO_BASENAME=voidbr-live-$iso_edition-x86_64-$KERNEL_VERSION_$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "ISO_BASENAME=voidbr-live-$iso_edition-x86_64-$KERNEL_VERSION_$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Obter a hora atual
        id: time
        shell: bash
        run: |
          #Obter a hora atual
          #echo "::set-output name=time::$(date +'%Y.%m.%d-%H%M')"
          echo "time=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Capturar hora de início do workflow
        id: start-time
        shell: bash
        run: |
          START_TIME=$(date +"%Y-%m-%d %H:%M:%S")  # Hora completa
          START_TIMESTAMP=$(date +%s)  # Timestamp em segundos
          echo "Início do Workflow: $START_TIME"
          echo "START_TIME=$START_TIME"             >> $GITHUB_ENV
          echo "START_TIMESTAMP=$START_TIMESTAMP"   >> $GITHUB_ENV
          echo "START_TIME='$START_TIME'"           >> shared_file.txt
          echo "START_TIMESTAMP='$START_TIMESTAMP'" >> shared_file.txt

      - name: Create Global Helpers Script - Definir a função send_telegram_message no script temporário
        shell: bash
        env:
          TELEGRAM_TOKEN: "${{ inputs.telegram_token }}"
          TELEGRAM_VOIDBR_ISO_TOKEN_BOT: "${{ inputs.voidbr_iso_token_bot }}"
          TELEGRAM_CHAT_ID: "${{ inputs.telegram_chat_id }}"
          TELEGRAM_MESSAGE_THREAD_ID: "${{ inputs.telegram_message_thread_id }}"
        run: |
          #Definir a função send_telegram_message no script temporário
          sudo rm -rf /tmp/send_telegram_message.sh  # Remove se for diretório
          cat << 'EOF' > /tmp/send_telegram_message.sh
          export TERM=${TERM:-xterm}
          export TERM=${TERM:-xterm-256color}

          #Definindo variáveis de cores
          export reset="\033[0m"
          export rst="\033[0m"
          export green="\033[01;32m"
          export red="\033[01;31m"
          export blue="\033[01;34m"
          export cyan="\033[01;36m"
          export pink="\033[01;35m"
          export yellow="\033[01;33m"
          alias ls='ls -lha --color=auto'
          alias dir='ls -lha --color=auto'

          die() {
            local msg="$1"
            msg="$(sed 's/<[^>]*>//g' <<< "$msg")" # Remove as tags HTML
            echo -e "BP=>${cyan}error: ${red}${msg}${reset}"
            exit  1
          }
          export -f die

          msg() {
            local msg="$1"
            msg="$(sed 's/<[^>]*>//g' <<< "$msg")" # Remove as tags HTML
            echo -e "BIV=>${cyan}running: ${yellow}${msg}${reset}"
          }

          msg_tab() {
            local msg="$1"
            msg="$(sed 's/<[^>]*>//g' <<< "$msg")" # Remove as tags HTML
            echo -e "BIV=>${cyan}info   : ${yellow}${msg}${reset}"
          }

          msg_raw() {
            local msg="$1"
            # Remove tags HTML, se existirem
            #msg="$(sed 's/<[^>]*>//g' <<< "$msg")"

            # Verifica se existe ':' na mensagem
            if [[ "$msg" == *:* ]]; then
              # Divide a string antes e depois do primeiro ':'
              local before_colon="${msg%%:*}:"
              local after_colon="${msg#*: }"
              # Aplica as cores
              msg="${cyan}${before_colon} ${yellow}${after_colon}${reset}"
            else
              # Se não houver ':', aplica apenas a cor padrão
              msg="${cyan}${msg}${reset}"
            fi
            echo -e "$msg"
          }
          export -f msg_raw

          msg_ok() {
            local msg="$1"
            msg="$(sed 's/<[^>]*>//g' <<< "$msg")" # Remove as tags HTML
            echo -e "BP=>${cyan}feito  : ${green}${msg}${reset}"
          }
          export -f msg_ok

          msg_run() {
            local msg="$*"
            echo -e "BP=>${cyan}running: ${yellow}${msg}${reset}"

            # Executa o comando e captura o código de saída
            if ! eval "$msg"; then
              echo -e "BP=>${red}Erro ao executar: ${yellow}${msg}${reset}" >&2
              return 1
            fi
            return 0
          }
          export -f msg_run

          msg_info() {
            local msg="$1"
            msg="$(sed 's/<[^>]*>//g' <<< "$msg")" # Remove as tags HTML
            echo -e "BIV=>${yellow}info   : ${cyan}${msg}${reset}"
          }

          msg_warning() {
            local msg="$1"
            msg="$(sed 's/<[^>]*>//g' <<< "$msg")" # Remove as tags HTML
            echo -e "BIV=>${red}warning: ${orange}${msg}${reset}"
          }

          replicate() {
            local char=${1:-'#'}
            local nsize=${2:-$(tput cols)}
            local line
            printf -v line "%*s" "$nsize" && echo -e "${blue}${line// /$char}${reset}"
          }
          export -f replicate

          # destino das notificacoes deste workflow
          TG_TOKEN=$TELEGRAM_VOIDBR_ISO_TOKEN_BOT
          TG_CHAT=$CHAT_ID
          TG_THREAD=$MESSAGE_THREAD_ID
          TG_TOTAL=3

          # titulo: "voidbr-live xfce"
          tg_title() { printf 'voidbr-live %s' "$(html_escape "$iso_edition")"; }

          # linha 3: kernel e tag da release (definidos no job setup)
          tg_line3() {
            printf '🐧 kernel %s · 🔖 %s' "$(html_escape "${TG_KERNEL:-?}")" "$(html_escape "${TG_RELEASE:-?}")"
          }

          # ----------------------------------------------------------------
          # Notificacoes Telegram - molde unico de 5 linhas (igual ao
          # voidbr-build-package). Antes de usar defina TG_TOKEN, TG_CHAT,
          # TG_THREAD, TG_TOTAL (total de etapas) e tg_title/tg_line3.
          # ----------------------------------------------------------------

          # escapa &, < e > para o parse_mode=HTML do Telegram
          html_escape() {
            local s=$1
            # replacement entre aspas: no bash 5.2+ um & solto vira o texto casado
            s=${s//&/"&amp;"} s=${s//</"&lt;"} s=${s//>/"&gt;"}
            printf '%s' "$s"
          }

          # tempo decorrido desde o timestamp $1 (padrao: inicio do workflow, TG_START_TS)
          fmt_duration() {
            local t0=${1:-$TG_START_TS}
            [[ -n $t0 ]] || { printf '?'; return; }
            local s=$(( $(date +%s) - t0 ))
            if (( s >= 3600 )); then
              printf '%dh %02dm' $((s / 3600)) $((s % 3600 / 60))
            elif (( s >= 60 )); then
              printf '%dm %02ds' $((s / 60)) $((s % 60))
            else
              printf '%ds' "$s"
            fi
          }

          # tamanho legivel de um arquivo
          fmt_size() {
            [[ -f $1 ]] || { printf '?'; return; }
            numfmt --to=iec-i --suffix=B "$(stat -c %s "$1")" 2>/dev/null \
              || du -h "$1" | cut -f1
          }

          # "👤 usuario · ⚙️ evento" (agendado nao tem usuario)
          tg_origin() {
            local user=${started_by_user:-$GITHUB_ACTOR}
            case $GITHUB_EVENT_NAME in
              schedule)            printf '⏰ agendado · ⚙️ cron' ;;
              push)                printf '👤 <a href="https://github.com/%s">%s</a> · ⚙️ push' "$user" "$(html_escape "$user")" ;;
              workflow_dispatch)   printf '👤 <a href="https://github.com/%s">%s</a> · ⚙️ manual' "$user" "$(html_escape "$user")" ;;
              repository_dispatch) printf '👤 <a href="https://github.com/%s">%s</a> · ⚙️ dispatch' "$user" "$(html_escape "$user")" ;;
              *)                   printf '👤 <a href="https://github.com/%s">%s</a> · ⚙️ %s' "$user" "$(html_escape "$user")" "$GITHUB_EVENT_NAME" ;;
            esac
          }

          # send_telegram_msg <html> [botoes extras: ,{"text":..,"url":..}]
          send_telegram_msg() {
            local MESSAGE=$1 extra=$2
            local run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            local markup="{\"inline_keyboard\":[[{\"text\":\"🔗 Job #${GITHUB_RUN_NUMBER}\",\"url\":\"${run_url}\"}${extra}]]}"

            echo -e "${green}$(sed 's/<[^>]*>//g' <<< "$MESSAGE")${reset}"
            [[ -n $TG_TOKEN && -n $TG_CHAT ]] || return 0
            curl -s -o /dev/null -w "telegram: %{http_code}\n" \
              -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d chat_id="$TG_CHAT" \
              ${TG_THREAD:+-d message_thread_id="$TG_THREAD"} \
              --data-urlencode text="$MESSAGE" \
              --data-urlencode reply_markup="$markup" \
              -d link_preview_options='{"is_disabled":true}' \
              -d parse_mode="HTML" || true
          }

          # tg_notify <icone> <etapa> <status> <linha4> [botoes extras]
          #   <icone> <titulo> · n/N · <status>
          #   👤 usuario · ⚙️ evento
          #   <linha 3 do workflow (tg_line3)>
          #   <linha 4: artefato ou ⚠️ motivo>
          #   🕒 inicio · ⏱ duracao [· 🐞 tmate]
          tg_notify() {
            local icon=$1 step=$2 status=$3 line4=$4 extra=$5
            local time_line="🕒 ${TG_START_TIME} · ⏱ $(fmt_duration)"
            [[ $DEBUG == true ]] && time_line+=" · 🐞 tmate"
            send_telegram_msg "${icon} <b>$(tg_title)</b> · <code>${step}/${TG_TOTAL}</code> · ${status}
          $(tg_origin)
          $(tg_line3)
          ${line4}
          ${time_line}" "$extra"
          }

          # Retorno: 0 = online e repo válido, 1 = offline/inválido
          test_repo_online() {
            [ $# -eq 1 ] || return 1
            local repo="${1%/}"
            local repodata="${repo}/x86_64-repodata"

            case "$repo" in
              *repo-fastly.voidlinux.org*)
              return 0
              ;;

              http://*|https://*)
                # Testa se o servidor responde
                timeout 20 curl \
                  --silent \
                  --show-error \
                  --location \
                  --range 0-0 \
                  "$repo/" \
                  >/dev/null 2>&1 || return 1

                # Testa se o repodata existe
                timeout 20 curl \
                  --fail \
                  --silent \
                  --show-error \
                  --location \
                  --output /dev/null \
                  "$repodata"
                ;;

              *)
                [ -e "$repodata" ]
                ;;
            esac
          }
          export -f test_repo_online

          EOF
          chmod +x /tmp/send_telegram_message.sh

          # inicio do workflow (fixo -04, nao depende de tzdata), kernel e
          # release gravados no proprio script, para valer tambem no job build
          {
            echo "export TG_START_TIME='$(TZ='<-04>4' date +'%d/%m/%Y %H:%M')'"
            echo "export TG_START_TS='$(date +%s)'"
            echo "export TG_KERNEL='$KERNEL_VERSION'"
            echo "export TG_RELEASE='$RELEASE_TAG'"
          } >> /tmp/send_telegram_message.sh

      - name: Enviar notificação inicial para o Telegram
        shell: bash
        run: |
          source /tmp/send_telegram_message.sh
          replicate
          msg "- name: Enviar notificação inicial para o Telegram"

          msg_tab "ISO_BRANCH='$iso_branch'"
          msg_tab "ISO_BRANCH='$iso_branch'"
          echo "ISO_BRANCH='$iso_branch'" >> GITHUB_ENV
          echo "ISO_BRANCH='$iso_branch'" >> shared_file.txt

          tg_notify "🚀" 1 "Iniciando" "💿 aguardando o mklive"
          replicate

      - name: Install dependencies in HOST
        #if: runner.os == 'Linux' && !contains(runner.name, 'voidrepo')
        if: runner.environment == 'github-hosted'
        shell: bash
        run: |
          #Install dependencies in HOST
          #sudo apt-get update
          #sudo apt-get autoremove
          #sudo apt-get install -y inetutils-tools duf tree tmate
          sudo apt-get install -y inetutils-tools duf tree

      #      - name: Setup TMATE Session in HOST
      #        uses: mxschmitt/action-tmate@v3
      #        with:
      #          install-dependencies: false
      #          detached: true

      - name: Set up volume directory in HOST
        shell: bash
        run: |
          #Set up volume directory in HOST
          sudo mkdir -p /voidrepo/mnt/var_lib_manjaro_tools_buildiso
          sudo mkdir -p /voidrepo/mnt/var_cache_manjaro_tools_iso
          sudo mkdir -p /voidrepo/mnt/lfs

      #      - name: Cria um arquivo de variaveis para compartilhar entre jobs
      #        shell: bash
      #        run: |
      #          #Cria um arquivo de variaveis para compartilhar entre jobs
      #          echo "START_TIME='$START_TIME'"           >> shared_file.txt
      #          echo "START_TIMESTAMP='$START_TIMESTAMP'" >> shared_file.txt
      #          echo "ISO_BRANCH='$iso_branch'"           >> shared_file.txt

      - name: Obter nome do repositório
        id: get-repo-name
        shell: bash
        run: |
          source /tmp/send_telegram_message.sh
          replicate
          msg "- name: Obter nome do repositório"
          msg_tab "repo_name=$(basename $GITHUB_REPOSITORY)"
          echo "repo_name=$(basename $GITHUB_REPOSITORY)" >> $GITHUB_OUTPUT
          replicate

      - name: Upload script as artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-script
          path: /tmp/send_telegram_message.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shared-file
          path: shared_file.txt

      - name: Display the current user in HOST
        shell: bash
        run: |
          source /tmp/send_telegram_message.sh
          msg "- name: Display the current user in HOST"
          replicate
          msg_raw "Current host is    : $(hostname)"
          msg_raw "Current user is    : $(whoami)"
          msg_raw "Current user ID is : $(id -u)"
          msg_raw "Current user details:"
          id
          replicate

  build:
    name: Build ISO ${{ matrix.edition }}
    runs-on: ubuntu-latest
    #runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        #arch: [x86_64, aarch64]
        #edition: ${{ (inputs.edition || 'teste') == 'all' && fromJson('["base","fullx","xfce","mate","gnome","plasma","fluxbox","awesome","cinnamon","enlightenment"]') || fromJson(format('["{0}"]', inputs.edition || 'teste')) }}
        edition: ${{ (inputs.edition || 'teste') == 'all' && fromJson('["base","fullx","xfce","mate","gnome","plasma","cinnamon"]') || fromJson(format('["{0}"]', inputs.edition || 'teste')) }}
    needs: [setup] # Espera o job "setup" terminar
    env:
      REPO_NAME: "${{ github.repository }}"
      iso_edition: ${{ matrix.edition }}
      iso_basename: voidbr-live-${{matrix.edition}}-x86_64-6.12.74_1_00000000-0000
    container:
      #image: vcatafesta/voidlinux-docker:latest
      #image: vcatafesta/voidlinux-docker:1.1
      #image: vcatafesta/voidlinux-docker:1.2 #ter 17 dez 2024 21:48:17 -04
      #image: vcatafesta/voidlinux-docker:1.4
      image: vcatafesta/voidlinux-docker:1.5 #seg 16 fev 2026 23:52:08 -04
      options: --privileged
      volumes:
        - /voidrepo/mnt/var_lib_manjaro_tools_buildiso:/var/lib/manjaro-tools/buildiso
        - /voidrepo/mnt/var_cache_manjaro_tools_iso:/var/cache/manjaro-tools/iso
        - /voidrepo/mnt/lfs/${{ matrix.edition }}:/mnt/lfs
        - /voidrepo/void-mirror/iso:/voidrepo/void-mirror/iso

    steps:
      - name: Check DEBUG Condition
        if: ${{ env.DEBUG == 'true' }}
        shell: bash
        run: |
          #Check DEBUG Condition
          #source /tmp/send_telegram_message.sh
          #replicate '='
          echo "DEBUG is true. Activating TMATE."
          #replicate '='

      - name: Setup TMATE Session in CONTAINER
        uses: mxschmitt/action-tmate@v3
        if: env.DEBUG == 'true'
        with:
          install-dependencies: false
          detached: true

      - name: Download Telegram Script
        uses: actions/download-artifact@v4
        with:
          name: telegram-script
          path: /tmp/ # O download-artifact vai colocar o arquivo em /tmp/send_telegram_message.sh dentro do container

      - name: Download artifact shared-file
        uses: actions/download-artifact@v4
        with:
          name: shared-file

      - name: Exibir e carregar variáveis do arquivo shared_file.txt no CONTAINER
        if: ${{ env.DEBUG == 'true' }}
        shell: bash
        run: |
          source /tmp/send_telegram_message.sh
          replicate
          msg "- name: Exibir e carregar variáveis do arquivo shared_file.txt no CONTAINER"
          cat shared_file.txt
          # Atribuir o conteúdo do arquivo à variável START_TIME
          #START_TIME="$(<shared_file.txt)"
          source shared_file.txt
          # Definir a variável START_TIME para outros jobs
          msg "START_TIME=$START_TIME"
          msg "START_TIMESTAMP=$START_TIMESTAMP"
          msg "ISO_BRANCH=$ISO_BRANCH"
          echo "START_TIME=$START_TIME"           >> $GITHUB_ENV
          echo "START_TIMESTAMP=$START_TIMESTAMP" >> $GITHUB_ENV
          echo "ISO_BRANCH=$ISO_BRANCH"           >> $GITHUB_ENV
          replicate

      - name: Checkout repository voidbr-build-iso
        uses: actions/checkout@v4
        with:
          #fetch-depth: 0    # All commit history is downloaded
          fetch-depth: 1 # Only the most recent commit of the branch will be downloaded

      - name: Set up volume directory in CONTAINER
        shell: bash
        run: |
          #Set up volume directory in HOST
          mkdir -p /mnt/lfs
          ln -sf /mnt/lfs /lfs

      - name: Install Required Packages and Configure Online XBPS Repository Mirrors in CONTAINER
        shell: bash
        run: |
          set -eu
          set -f
          source /tmp/send_telegram_message.sh
          replicate
          msg "- name: Install Required Packages and Configure Online XBPS Repository Mirrors in CONTAINER"
          REPO_FILE='/etc/xbps.d/00-repository-main.conf'

          declare -a REPOS=(
            'https://void.voidbr.org/voidlinux/current'
            'https://repo-fastly.voidlinux.org/current'
            'https://void.chililinux.com/voidlinux/current'
            'https://void.voidlinux.com.br/voidlinux/current'
          )

          add_repo_group() {
            local repo="$1"
            local entry
            declare -a entries=()

            case "$repo" in
              'https://void.voidbr.org/voidlinux/current')
                entries=(
                  "$repo"
                  'https://void.voidbr.org/voidlinux/extra'
                  "$repo/nonfree"
                  "$repo/multilib"
                  "$repo/multilib/nonfree"
                )
              ;;

              'https://repo-fastly.voidlinux.org/current')
                entries=(
                  "$repo"
                  "$repo/nonfree"
                  "$repo/multilib"
                  "$repo/multilib/nonfree"
                )
              ;;

              'https://void.chililinux.com/voidlinux/current')
                entries=(
                  "$repo"
                )
              ;;

              'https://void.voidlinux.com.br/voidlinux/current')
                entries=(
                  "$repo"
                  'https://void.voidlinux.com.br/voidlinux/extra'
                  "$repo/nonfree"
                  "$repo/multilib"
                  "$repo/multilib/nonfree"
                )
              ;;

            esac

            for entry in "${entries[@]}"; do
              printf 'repository=%s\n' "$entry"
            done
            printf '\n'
          }

          printf '\n==> Testando mirrors XBPS...\n\n'
          rm -f /etc/xbps.d/*.conf
          : > "$REPO_FILE"

          for repo in "${REPOS[@]}"; do
            printf ':: %s ... ' "$repo"
            if test_repo_online "$repo"; then
              printf '\033[1;32mONLINE\033[0m\n'
              add_repo_group "$repo" >> "$REPO_FILE"
            else
              printf '\033[1;31mOFFLINE\033[0m\n'
            fi
          done

          printf '\n==> Ordem final dos mirrors:\n\n'
          cat "$REPO_FILE"

          xbps-install -Sy
          xbps-install -yu xbps
          xbps-install -yu \
            bash \
            xtools \
            sudo \
            openssh \
            tmate \
            xz \
            zip \
            p7zip \
            jq \
            github-cli \
            kmod \
            which \
            vpm \
            libstdc++ \
            nano \
            curl \
            git \
            bash \
            tree \
            duf \
            gettext \
            rsync \
            util-linux \
            coreutils \
            sed \
            grep \
            btrfs-progs \
            e2fsprogs \
            exfatprogs \
            dosfstools \
            xfsprogs \
            tailscale

          vinstall -Scc
          rm -f /etc/xbps.d/*.conf
          : > "$REPO_FILE"

          xbps-install -Sy ncurses
          xbps-install -Syu # atualiza restante somente dos repositorios online
          replicate

      - name: Conectar na Tailnet
        #if: runner.os == 'Linux' && !contains(runner.name, 'voidrepo')
        if: runner.environment == 'github-hosted'
        shell: bash
        run: |
          sudo tailscaled &
          sleep 3 || true

          sudo tailscale up \
            --authkey=${TS_AUTHKEY} \
            --hostname=ci-void \
            --accept-routes \
            --accept-dns=false \
            --reset || true

          tailscale status || true
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}

      - name: Create user builduser in CONTAINER
        shell: bash
        run: |
          source /tmp/send_telegram_message.sh
          replicate
          msg "- name: Create user builduser in CONTAINER"
          if ! getent passwd builduser >/dev/null; then
            useradd -m -G wheel,audio,video,cdrom,optical,kvm,xbuilder builduser || true
          fi
          id builduser
          replicate

      - name: Initial Debug in CONTAINER
        if: ${{ env.DEBUG == 'true' }}
        env:
          EVENT_JSON: ${{ toJson(github.event) }}
        shell: bash
        run: |
          source /tmp/send_telegram_message.sh
          replicate
          msg "- name: Initial Debug in CONTAINER"
          echo "Workflow started"
          echo "Event Name: ${{ github.event_name }}"
          echo "Event Action: ${{ github.event.action }}"
          echo "Edition: ${{ github.event.client_payload.edition || inputs.edition }}"
          echo "Tmate from payload: ${{ github.event.client_payload.tmate || inputs.tmate != false && inputs.tmate }}"
          echo "Full github event:"
          printf '%s\n' "$EVENT_JSON"
          replicate

      - name: Display the current user in CONTAINER
        if: ${{ env.DEBUG == 'true' }}
        shell: bash
        run: |
          source /tmp/send_telegram_message.sh
          replicate
          msg "- name: Display the current user in CONTAINER"
          echo "#########################################"
          echo "Current container is: $(hostname)"
          echo "Current user is: $(whoami)"
          echo "Current user ID is: $(id -u)"
          echo "Current user details:"
          id
          replicate
          #df -hT
          duf
          #replicate
          #ls -lah --color=auto /mnt
          #replicate
          ##tree -d /mnt
          replicate

      - name: Build ISO ${{ matrix.edition }}
        if: ${{ inputs.teste_input != true }}
        uses: ./
        id: build
        with:
          vol_id: ${{env.vol_id}}
          #edition: ${{env.iso_edition}}
          edition: ${{ matrix.edition }}
          release_tag: ${{env.RELEASE_TAG}}
          github_token: ${{env.GITHUB_TOKEN}}
          tmate: ${{ env.DEBUG }}
          iso_basename: ${{ env.iso_basename }}

      #ponto de retorno do action.yml
      - name: Set ISO path on create-iso
        shell: bash
        run: |
          source /tmp/send_telegram_message.sh
          replicate
          msg "- name: Set ISO path on create-iso"
          echo "ISO_PATH=${{ env.WORK_PATH }}/${{ env.ISO_BASENAME }}" >> $GITHUB_ENV

      - name: Verificar se o arquivo .iso foi gerado corretamente
        if: ${{ inputs.teste_input != true }}
        shell: bash
        run: |
          source /tmp/send_telegram_message.sh
          replicate
          msg "- name: Verificar se o arquivo .iso foi gerado corretamente"
          pushd "${{ env.WORK_PATH }}" || true
          msg_run 'ls -lah --color=auto'
          popd || true
          replicate

      - name: Calculate ISO MD5 Hash
        shell: bash
        run: |
          source /tmp/send_telegram_message.sh
          replicate
          msg "- name: Calculate ISO MD5 Hash"
          msg_run "ls -lah --color=auto"
          replicate

          msg "Calculating MD5 hash for ISO file ${ISO_PATH}"
          pushd "${{ env.WORK_PATH }}" || true

          if [[ -f "${{ env.ISO_BASENAME }}" ]]; then
            md5sum "${{ env.ISO_BASENAME }}" > "${{ env.ISO_BASENAME }}.md5"
            msg_info "MD5 '$ISO_BASENAME.md5' hash calculated and saved:"
            cat "${{ env.ISO_BASENAME }}.md5"
          else
            msg_warning "Error: ${{ env.ISO_BASENAME }} file not found at ${{ env.WORK_PATH }}"
            exit 1
          fi

          msg_run "ls -lah --color=auto"
          replicate
          popd || true

      - name: Prepare ISO for release (7z)
        id: prepare-iso
        shell: bash
        run: |
          #Prepare ISO for release (7z)
          source /tmp/send_telegram_message.sh
          replicate
          msg "- name: Prepare ISO for release (7z)"
          tg_notify "📦" 2 "Empacotando" "💿 <code>$(html_escape "${ISO_BASENAME%.iso}")</code> · $(fmt_size "$ISO_PATH")"
          replicate '='
          ls -lah
          release=$(basename "${ISO_PATH}" .iso)
          release_name="${release}"

          # Obtém o tamanho do arquivo em bytes
          file_size=$(stat -c%s "${ISO_PATH}")

          # Verifica se o tamanho é maior que 2000 MB (2000 * 1024 * 1024 bytes)
          if (( file_size > 2000 * 1024 * 1024 )); then
            msg_info "O arquivo é maior que 2000 MB. Compactando e dividindo..."
            #7z a -v2000m "${release}.7z" "${ISO_PATH}" # Compacta e divide em partes de 2000 MB
            #upload_path="${release}.7z*"
            7z a -v2000m "${ISO_PATH}.7z" "${ISO_PATH}"
            upload_path="${ISO_PATH}.7z*"
          else
            msg_info "O arquivo não é maior que 2000 MB. Não será compactado."
            upload_path="${ISO_PATH}"
          fi

          echo "release=${release}"         >> "$GITHUB_OUTPUT"
          echo "release_name=${release}"    >> "$GITHUB_OUTPUT"
          echo "upload_path=${upload_path}" >> "$GITHUB_OUTPUT"

          msg_info "ISO ${release} prepared for release"
          replicate '='
          ls -lah
          replicate '='
          # Debug
          msg_info "ISO_PATH (original): ${ISO_PATH}"
          msg_info "Upload Path        : ${upload_path}"
          msg_info "ISO_PATH (md5)     : ${ISO_PATH}.md5"
          msg_info "release            : ${release}"
          msg_info "release_name       : ${release_name}"
          replicate '='

      - name: Upload ISO + MD5 as artifact
        if: ${{ inputs.teste_input != true }}
        uses: actions/upload-artifact@v4
        with:
          ###############################################################################################
          # O actions/upload-artifact compacta automaticamente os arquivos/diretórios que você indicar em path:.
          # O formato de saída é sempre um ZIP, não há opção oficial para trocar por .tar.gz, .7z, etc.
          ###############################################################################################
          #name: Full_ISO_${{ steps.prepare-iso.outputs.release_name }}
          #name: ${{ env.ISO_BASENAME }}
          #name: ${{ steps.prepare-iso.outputs.release_name }}
          #name: ${{ steps.prepare-iso.outputs.release_name }}-${{ github.run_id }}
          name: ${{ steps.prepare-iso.outputs.release_name }}-${{ matrix.edition }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.ISO_FULLNAME }}.md5
            ${{ steps.prepare-iso.outputs.upload_path }}
          if-no-files-found: warn
          include-hidden-files: false

      - run: |
          echo "Artifact name: ${{ steps.prepare-iso.outputs.release_name }}-${{ matrix.edition }}-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Create Release
        if: ${{ inputs.teste_input != true }}
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.prepare-iso.outputs.upload_path }}
            ${{ env.ISO_PATH }}.md5
          tag_name: ${{matrix.edition}}-${{ env.ISO_TAG_NAME }}-${{ github.run_id }}
          name: ${{ steps.prepare-iso.outputs.release_name }}-${{ matrix.edition }}-${{ github.run_id }}-${{ github.run_attempt }}
          generate_release_notes: true
          body: |
            - **Data e Hora         :** ${{ env.START_TIME }}
            - **Arquivo ISO         :** ${{ env.ISO_BASENAME }}
            - **Arquivo MD5         :** ${{ env.ISO_BASENAME }}.md5
            - **Nome do Repositório :** ${{ env.REPO_NAME }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false

      - name: Set Release Download URL
        shell: bash
        run: |
          ISO_BASE_NAME="${ISO_BASENAME%.iso}"
          TAG="${{ env.ISO_TAG_NAME }}-${{ github.run_id }}"
          FILE_NAME="${{ steps.prepare-iso.outputs.release_name }}" 
          DOWNLOAD_URL_ISO="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${FILE_NAME}.iso"
          DOWNLOAD_URL_ZIP="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.zip"
          DOWNLOAD_URL_GZ="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          echo "DOWNLOAD_URL_ISO=$DOWNLOAD_URL_ISO" >> $GITHUB_ENV
          echo "DOWNLOAD_URL_ZIP=$DOWNLOAD_URL_ZIP" >> $GITHUB_ENV
          echo "DOWNLOAD_URL_GZ=$DOWNLOAD_URL_GZ" >> $GITHUB_ENV
          echo "ISO_BASE_NAME=$ISO_BASE_NAME" >> $GITHUB_ENV

      - name: Get Artifact URL
        id: get-artifact-url
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          #FILE_NAME: "${ISO_BASENAME%.iso}"
          FILE_NAME: "${{ steps.prepare-iso.outputs.release_name }}"
          RUN_ID: "${{ github.run_id }}"
          REPO: "${{ github.repository }}"
        shell: bash
        run: |
          # Get Artifact URL
          artifacts=$(gh api \
            -H "Accept: application/vnd.github+json"\
            -H "X-GitHub-Api-Version: 2022-11-28" \
             /repos/$REPO/actions/runs/$RUN_ID/artifacts)

            echo "$artifacts" | jq .

            artifact_id=$(echo "$artifacts" | jq -r --arg file_name "$FILE_NAME" '.artifacts[] | select(.name==$file_name) | .id')
            echo "artifact_id=$artifact_id" >> $GITHUB_ENV
            echo "Artifact ID: $artifact_id"

            artifact_size_in_bytes=$(echo "$artifacts" | jq -r --arg file_name "$FILE_NAME" '.artifacts[] | select(.name==$file_name) | .size_in_bytes')
            echo "artifact_size_in_bytes=$artifact_size_in_bytes" >> $GITHUB_ENV
            echo "Artifact SiZE: $artifact_size_in_bytes"

            artifact_url=https://github.com/$REPO/actions/runs/$RUN_ID/artifacts/$artifact_id
            echo "artifact_url=$artifact_url" >> $GITHUB_ENV
            echo "Artifact URL: $artifact_url"

      - name: Configurar chave SSH e Adicionar chave do host remoto ao known_hosts
        if: ${{ inputs.teste_input != true }}
        shell: bash
        run: |
          source /tmp/send_telegram_message.sh
          replicate
          msg_raw "- name: Configurar chave SSH e Adicionar chave do host remoto ao known_hosts"
          #Configurar chave SSH e Adicionar chave do host remoto ao known_hosts
          rm -rf /root/.ssh
          mkdir -p /root/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > /root/.ssh/id_rsa_${{matrix.edition}}
          chmod 700 /root/.ssh
          chmod 600 /root/.ssh/id_rsa_${{matrix.edition}}

          msg "Gera chave publica a partir da privada:"
          ssh-keygen -y -f /root/.ssh/id_rsa_${{matrix.edition}} > /root/.ssh/id_rsa_${{matrix.edition}}.pub

          msg "Mostra chave privada"
          msg_run "cat /root/.ssh/id_rsa_${{matrix.edition}}" || true

          msg "Mostra chave publica"
          msg_run "cat /root/.ssh/id_rsa_${{matrix.edition}}.pub" || true

          msg "Validar chave:"
          msg_run "ssh-keygen -l -f /root/.ssh/id_rsa_${{matrix.edition}}" || true

          msg "Adiciona o host aos conhecidos para não travar"
          msg_run "ssh-keyscan -p ${{ secrets.SERVER_PORT }}      -H ${{ secrets.SERVER_HOST }}      >> /root/.ssh/known_hosts" || true
          msg_run "ssh-keyscan -p ${{ secrets.TS_VOIDREPO_PORT }} -H ${{ secrets.TS_VOIDREPO_HOST }} >> /root/.ssh/known_hosts" || true

          replicate

      - name: Copiar o arquivo ISO para o servidor VOIDREPO via local
        id: cp_voidrepo
        #if: runner.os == 'Linux' && contains(runner.name, 'voidrepo')
        if: runner.environment == 'self-hosted'
        #if: ${{ inputs.teste_input != true }}
        shell: bash
        run: |
          source /tmp/send_telegram_message.sh
          msg "- name: Copiar o arquivo ISO para o servidor VOIDREPO via local"
          ls -la "${{ env.ISO_PATH }}" --color=auto || true
          ls -la "${{ env.ISO_PATH }}.md5" --color=auto || true
          ls -la "${{ env.WORK_PATH }}/${{ env.ISO_BASENAME }}" || true

          #msg_run "cp -v ${{ env.ISO_FULLNAME }}.md5 $voidrepo_void_mirror_iso/" || true
          #if sed 's/^[ \t]*//'f msg_run "cp -v ${{ env.ISO_FULLNAME }}  $voidrepo_void_mirror_iso/"; then
          if msg_run "cp -v ${{ env.ISO_FULLNAME }} $voidrepo_void_mirror_iso/"; then
            echo "UP_VOIDREPO=✅" >> "$GITHUB_ENV"
          else
            echo "UP_VOIDREPO=❌" >> "$GITHUB_ENV"
          fi

          replicate

      - name: Enviar arquivo ISO para o servidor VOIDREPO via SCP com porta customizada
        id: scp_upload_voidrepo
        #if: runner.os == 'Linux' && !contains(runner.name, 'voidrepo')
        if: runner.environment == 'github-hosted'
        #if: ${{ inputs.teste_input != true }}
        shell: bash
        run: |
          source /tmp/send_telegram_message.sh
          msg "- name: Enviar arquivo ISO para o servidor via SCP com porta customizada"
          ls -la "${{ env.ISO_PATH }}" --color=auto || true
          ls -la "${{ env.ISO_PATH }}.md5" --color=auto || true
          ls -la "${{ env.WORK_PATH }}/${{ env.ISO_BASENAME }}" || true

          # Envia a ISO e o MD5 usando os caminhos absolutos confirmados
          # SCP cirúrgico:
          # 1. Usa o curinga (*) para pegar tanto a ISO única quanto partes .7z
          # 2. BatchMode=yes para não travar pedindo senha
          #${{ env.WORK_PATH }}/${{ steps.prepare-iso.outputs.release }}* \
          #-o BatchMode=yes \

          msg_run "cp -v ${{ env.ISO_FULLNAME }}     $voidrepo_void_mirror_iso/vc.iso"
          msg_run "cp -v ${{ env.ISO_FULLNAME }}.md5 $voidrepo_void_mirror_iso/vc.iso.md5"

          # Monta comando como array
          cmd=(
            scp
            -P "${{ secrets.TS_VOIDREPO_PORT }}"
            -o StrictHostKeyChecking=no
            -i "/root/.ssh/id_rsa_${{ matrix.edition }}"
          )

          # Adiciona -v se DEBUG=true
          if $DEBUG; then
            cmd+=(-v)
          fi

          # Executa
          if "${cmd[@]}" \
            "${{ env.ISO_FULLNAME }}" \
            "${{ env.ISO_FULLNAME }}.md5" \
            "${{ secrets.TS_VOIDREPO_USER }}@${{ secrets.TS_VOIDREPO_HOST }}:/voidrepo/void-mirror/iso"
          then
            echo "UP_VOIDREPO=✅" >> "$GITHUB_ENV"
          else
            echo "UP_VOIDREPO=❌" >> "$GITHUB_ENV"
          fi

          replicate

      - name: Enviar arquivo ISO para o servidor HOSTINGER via SCP com porta customizada
        id: scp_upload_hostinger
        if: ${{ inputs.teste_input != true }}
        shell: bash
        run: |
          source /tmp/send_telegram_message.sh
          msg "- name: Enviar arquivo ISO para o servidor via SCP com porta customizada"
          ls -la "${{ env.ISO_PATH }}" --color=auto || true
          ls -la "${{ env.ISO_PATH }}.md5" --color=auto || true
          ls -la "${{ env.WORK_PATH }}/${{ env.ISO_BASENAME }}" || true

          # Envia a ISO e o MD5 usando os caminhos absolutos confirmados
          # SCP cirúrgico:
          # 1. Usa o curinga (*) para pegar tanto a ISO única quanto partes .7z
          # 2. BatchMode=yes para não travar pedindo senha
          #${{ env.WORK_PATH }}/${{ steps.prepare-iso.outputs.release }}* \
          #-o BatchMode=yes \

          # Monta comando como array
          cmd=(
            scp
            -P "${{ secrets.SERVER_PORT }}"
            -o StrictHostKeyChecking=no
            -i "/root/.ssh/id_rsa_${{ matrix.edition }}"
          )

          # Se quiser verbose quando DEBUG=true
          if $DEBUG; then
            cmd+=(-v)
          fi

          # Executa
          if "${cmd[@]}" \
            "${{ env.ISO_FULLNAME }}" \
            "${{ env.ISO_FULLNAME }}.md5" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/${{ secrets.SERVER_USER }}/void/iso"
          then
            echo "UP_HOSTINGER=✅" >> "$GITHUB_ENV"
          else
            echo "UP_HOSTINGER=❌" >> "$GITHUB_ENV"
          fi

          replicate

      - name: Telegram Alert Fail - Send a Telegram alert if the build fails
        if: failure()
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PREPARE_OUTCOME: ${{ steps.prepare-iso.outcome }}
          RELEASE_OUTCOME: ${{ steps.create_release.outcome }}
        run: |
          source /tmp/send_telegram_message.sh
          msg "- name: Telegram Alert Fail - Send a Telegram alert if the build fails"
          if [[ $BUILD_OUTCOME == failure ]]; then
            etapa=2 motivo="falha ao gerar a ISO (mklive)"
          elif [[ $PREPARE_OUTCOME == failure ]]; then
            etapa=2 motivo="falha ao empacotar a ISO (7z)"
          elif [[ $RELEASE_OUTCOME == failure ]]; then
            etapa=3 motivo="falha ao criar a release no GitHub"
          elif [[ -z $BUILD_OUTCOME || $BUILD_OUTCOME == skipped ]]; then
            etapa=1 motivo="falha ao preparar o container"
          else
            etapa=3 motivo="falha ao publicar a ISO (veja o log)"
          fi
          tg_notify "❌" "$etapa" "Falhou" "⚠️ ${motivo}"

      - name: Capturar hora de término e calcular duração
        shell: bash
        run: |
          source /tmp/send_telegram_message.sh
          replicate
          msg "- name: Capturar hora de término e calcular duração"
          sh_calc_duration_via_normal() {
            # Configurações
            START_TIME="${{ env.START_TIME }}"
            START_TIMESTAMP="${{ env.START_TIMESTAMP }}"
            END_TIME=$(date +"%Y-%m-%d %H:%M:%S")
            END_TIMESTAMP=$(date +%s)

            # Calcula a duração em segundos, horas, minutos e segundos
            duration=$((END_TIMESTAMP - START_TIMESTAMP))
            hours=$((duration / 3600))
            minutes=$(( (duration % 3600) / 60 ))
            seconds=$((duration % 60))
          }

          sh_calc_duration_via_api() {
            # Endpoint da API
            API_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs"

            # Fazendo a requisição para obter o último workflow run
            response=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
                              -H "Accept: application/vnd.github+json" \
                              "$API_URL")

            # Extraindo os horários (created_at e updated_at) do último workflow
            created_at=$(echo "$response" | jq -r '.workflow_runs[0].created_at')
            updated_at=$(echo "$response" | jq -r '.workflow_runs[0].updated_at')

            # Verificando se os valores foram obtidos
            if [[ -z "$created_at" || -z "$updated_at" ]]; then
              echo "Erro: Não foi possível obter os dados do workflow."
              exit 1
            fi

            # Convertendo horários para timestamps
            start_ts=$(date -d "$created_at" +%s)
            end_ts=$(date -d "$updated_at" +%s)

            START_TIME="$created_at"
            END_TIME="$updated_at"

            # Calculando a duração em segundos
            duration=$((end_ts - start_ts))

            # Convertendo para formato legível (HH:MM:SS)
            hours=$((duration / 3600))
            minutes=$(((duration % 3600) / 60))
            seconds=$((duration % 60))

            # Exibindo o tempo total
            printf "Tempo total da execução: %02d:%02d:%02d\n" "$hours" "$minutes" "$seconds"
          }

          sh_calc_duration_via_normal
          #sh_calc_duration_via_api

          # Obtém o ID do run e o URL do artefato a partir das variáveis de ambiente
          RUN_ID="${{ github.run_id }}"
          link_action="${{ env.artifact_url }}"
          file_name="${{ steps.prepare-iso.outputs.release_name }}"

          # Converte o tamanho do artefato para um formato legível
          if [[ -z "${artifact_size_in_bytes}" ]]; then
            artifact_size_in_bytes=$(stat -c%s "${{ env.ISO_FULLNAME }}")
          fi

          iso_size=$(numfmt --to=iec-i --suffix=B "${artifact_size_in_bytes}") || true

          # resultado dos envios (VOIDREPO: copia local ou scp; HOSTINGER: scp)
          if [[ $UP_VOIDREPO == ❌ || $UP_HOSTINGER == ❌ ]]; then
            icon="⚠️" status="Envio parcial"
          else
            icon="✅" status="Publicado"
          fi
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${{ matrix.edition }}-${{ env.ISO_TAG_NAME }}-${{ github.run_id }}"
          tg_notify "$icon" 3 "$status" \
            "📤 VOIDREPO ${UP_VOIDREPO:-—} · HOSTINGER ${UP_HOSTINGER:-—} · 💿 ${iso_size:-?}" \
            ",{\"text\":\"⬇️ Release\",\"url\":\"${release_url}\"}"
          replicate

      - name: Cleanup current workspace runner
        if: always() && runner.environment == 'self-hosted'
        run: |
          echo "Runner atual: $RUNNER_NAME"
          echo "Limpando $WORK_PATH"
          sudo rm -rfv "$WORK_PATH"/*
